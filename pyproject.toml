[project]
name = "django-heavy-water"
version = "0.2.2"
description = "Seed Django databases with development and test data using per-app data builders"
authors = [{ name = "Josh Asplund", email = "joshasplund@gmail.com" }]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "django-rich>=2.2.0",
]
keywords = ["django", "fixtures", "seed", "test data", "management command"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/joshuata/django-heavy-water"
Repository = "https://github.com/joshuata/django-heavy-water"
Issues = "https://github.com/joshuata/django-heavy-water/issues"
Changelog = "https://github.com/joshuata/django-heavy-water/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy",
    "django-stubs",
    "pytest",
    "pytest-django",
    "ruff~=0.16.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "heavy_water"

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W", "C90", "I", "UP", "DJ", "T20", "TD", "S"]
ignore = ["E501", "TD003"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and hard-coded credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# Run like a development environment: builders only run by default when DEBUG is on.
django_debug_mode = true
pythonpath = ["."]
testpaths = ["tests"]
# Our own code must never use deprecated builder attributes.
filterwarnings = ["error::heavy_water.HeavyWaterDeprecationWarning"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
python_version = "3.10"
strict = true
