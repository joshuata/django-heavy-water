name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # pinact (in lint) checks the pinned action SHAs against GitHub's API.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Check the release tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: mise run lint
      - run: mise run test
      - run: mise run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only the canonical repository is registered as a trusted publisher on PyPI.
    if: github.repository == 'joshuata/django-heavy-water'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-heavy-water/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: mise run publish
